<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>Личное видеописьмо</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 29, 47, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 24px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 16px;
            font-size: 26px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
        }

        /* 16:9 aspect ratio */
        .ratio-16-9 {
            padding-top: 56.25%;
        }

        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            object-fit: contain;
            background: #000;
        }

        /* State: Placeholder / Not ready yet */
        .placeholder-box {
            padding: 48px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .pulse-loader {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.2);
            border: 2px solid var(--accent);
            animation: pulse 2s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        .placeholder-text {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .placeholder-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 400px;
            line-height: 1.5;
        }

        .letter-note {
            margin-top: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.92rem;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: left;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.6);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-icon">✉️</div>
        <h1 id="title">Личное видеописьмо</h1>
        <p class="subtitle" id="subtitle">Специально для тебя</p>

        <div id="media-container"></div>

        <div id="note" class="letter-note" style="display: none;"></div>

        <div class="footer">
            🔒 Персональный защищенный доступ • 2026
        </div>
    </div>

    <script>
        /*
         =============================================================================
         НАСТРОЙКИ ВИДЕОПИСЬМА
         =============================================================================
         Вы можете обновить это в любой момент (даже через 3 недели):
         
         ВАРИАНТ 1 (Рекомендуемый для США -> Чехия): YouTube (доступ по ссылке / Unlisted)
         Вставьте ссылку на ролик или просто ID:
         Пример: youtubeUrl: "https://youtu.be/dQw4w9WgXcQ" или youtubeUrl: "dQw4w9WgXcQ"
         
         ВАРИАНТ 2: Файл MP4 на вашем сервере
         Положите видео в /opt/homelab/data/letter/media/video.mp4
         И укажите localVideo: "media/video.mp4"
         =============================================================================
        */
        const CONFIG = {
            // Вставьте ссылку на YouTube (доступ "по ссылке") ИЛИ оставьте пустым ""
            youtubeUrl: "",

            // ИЛИ локальный файл (например "media/video.mp4") ИЛИ оставьте пустым ""
            localVideo: "",

            // Заголовок и подзаголовок (можно поменять под адресата):
            title: "Привет из Чехии! ✉️",
            subtitle: "Сканирование прошло успешно. Это видео записано для тебя.",

            // Текстовая заметка под видео (оставьте пустым "", если не нужна):
            note: ""
        };

        // --- Внутренняя логика отображения ---
        document.getElementById('title').textContent = CONFIG.title;
        document.getElementById('subtitle').textContent = CONFIG.subtitle;
        if (CONFIG.note && CONFIG.note.trim() !== "") {
            const noteEl = document.getElementById('note');
            noteEl.innerHTML = CONFIG.note.replace(/\n/g, '<br>');
            noteEl.style.display = 'block';
        }

        function extractYouTubeId(urlOrId) {
            if (!urlOrId) return null;
            const str = urlOrId.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
            const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
            const match = str.match(regExp);
            return match ? match[1] : null;
        }

        const ytId = extractYouTubeId(CONFIG.youtubeUrl);
        const mediaContainer = document.getElementById('media-container');

        if (ytId) {
            // Показ встроенного YouTube (чистый плеер без мусора и похожих видео)
            mediaContainer.innerHTML = `
                <div class="video-wrapper ratio-16-9">
                    <iframe 
                        src="https://www.youtube-nocookie.com/embed/${ytId}?rel=0&modestbranding=1&playsinline=1&autoplay=1" 
                        title="Personal Video" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
            `;
        } else if (CONFIG.localVideo && CONFIG.localVideo.trim() !== "") {
            // Показ прямого видео HTML5 с сервера
            mediaContainer.innerHTML = `
                <div class="video-wrapper ratio-16-9">
                    <video controls playsinline preload="metadata" autoplay>
                        <source src="${CONFIG.localVideo}" type="video/mp4">
                        Ваш браузер не поддерживает видео HTML5.
                    </video>
                </div>
            `;
        } else {
            // Видео еще не загружено (письмо в пути)
            mediaContainer.innerHTML = `
                <div class="video-wrapper">
                    <div class="placeholder-box">
                        <div class="pulse-loader">⏳</div>
                        <div class="placeholder-text">Видеопослание бережно готовится...</div>
                        <div class="placeholder-sub">
                            Письмо уже доставлено или находится в пути. Скоро здесь появится персональное видеообращение!
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
