server {
    listen 80;
    listen [::]:80;
    server_name football-bot-yeronym.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name football-bot-yeronym.duckdns.org;

    ssl_certificate /etc/nginx/ssl/football/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/football/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL_FOOTBALL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # -------------------------------------------------------------------------
    # Secret Personal Video Letter (Capability URL: /v/<SECRET_TOKEN>)
    # -------------------------------------------------------------------------
    location = /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn {
        alias /var/www/letter/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location = /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn/ {
        return 301 /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn;
    }

    location ^~ /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn/media/ {
        alias /var/www/letter/media/;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # Block unauthorized scans of /v or /v/*
    location = /v {
        return 404;
    }

    location ^~ /v/ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # Default Route: Football Manager Web App & API
    # -------------------------------------------------------------------------
    location / {
        set $football_backend "http://football-manager-app:8000";
        proxy_pass $football_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
