server {
    listen 80;
    listen [::]:80;
    server_name special-letter.yeronym.duckdns.org yeronym.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name special-letter.yeronym.duckdns.org yeronym.duckdns.org;

    ssl_certificate /etc/nginx/ssl/yeronym/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/yeronym/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL_YERONYM_LETTER:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Secret Video Letter Landing (/v/<TOKEN>)
    # -------------------------------------------------------------------------
    location = /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn {
        alias /var/www/letter/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location = /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn/ {
        return 301 /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn;
    }

    location ^~ /v/RTWVPnZOermi36mV6m0w6Ln84olQzhcn/media/ {
        alias /var/www/letter/media/;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # Hide everything else
    location / {
        return 404;
    }
}
