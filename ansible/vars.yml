# ==============================================================================
# Homelab Ansible Variables
# ==============================================================================

# User configuration (automatically detects the non-root user who ran sudo)
target_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
homelab_install_dir: "/opt/homelab"
homelab_git_repo: "https://github.com/yeronymus/homelab.git"

# Storage configuration (SSD mode)
storage_data_dir: "/opt/homelab/data"
backup_dir: "/opt/homelab/backups"
use_sparse_disk: false
virtual_disk_size: "1000G"
virtual_disk_path: "/var/lib/homelab/virtual-hdd.img"
storage_mount_point: "/mnt/hdd"

# System settings
system_timezone: "Europe/Kyiv"

# Networking & Ingress
duckdns_domain: "your-subdomain"
duckdns_token: "your-duckdns-token"
domain_name: "your-subdomain.duckdns.org"

# Passwords and secrets
pihole_password: "ChangeThisSecretPassword123!"
vaultwarden_admin_token: "ChangeThisVaultwardenAdminToken123!"
vaultwarden_signups_allowed: "false"
grafana_admin_user: "admin"
grafana_admin_password: "ChangeThisGrafanaPassword123!"

# Monitoring
dead_mans_snitch_url: "https://nosnch.in/YOUR_TOKEN_HERE"
