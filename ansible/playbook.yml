---
- name: Deploy and Configure Homelab Server
  hosts: homelab
  become: true
  vars_files:
    - vars.yml

  tasks:
    # ==========================================================================
    # 1. System Base & Dependencies
    # ==========================================================================
    - name: Set system timezone
      community.general.timezone:
        name: "{{ system_timezone }}"

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install essential utility packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - htop
          - iotop
          - ufw
          - fail2ban
          - tlp
          - ca-certificates
          - gnupg
          - lsb-release
          - rsync
          - tar
          - sqlite3
          - e2fsprogs
        state: present

    # ==========================================================================
    # 2. Laptop Power Policy & Battery Management
    # ==========================================================================
    - name: Ensure logind.conf.d directory exists
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: '0755'

    - name: Deploy lid switch drop-in configuration
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/lid.conf
        content: |
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
          LidSwitchIgnoreInhibited=no
        mode: '0644'
      notify: Restart systemd-logind

    - name: Mask systemd sleep and suspend targets (prevent sleep on server)
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: yes
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Enable and start TLP service
      ansible.builtin.systemd:
        name: tlp
        enabled: yes
        state: started

    # ==========================================================================
    # 3. DNS Conflict Resolution (Free port 53 for Pi-hole if resolved is present)
    # ==========================================================================
    - name: Check if systemd-resolved configuration exists
      ansible.builtin.stat:
        path: /etc/systemd/resolved.conf
      register: resolved_conf_stat

    - name: Disable systemd-resolved DNSStubListener if resolved is present
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'
      when: resolved_conf_stat.stat.exists
      notify: Restart systemd-resolved

    # ==========================================================================
    # 4. Docker Engine & Compose Plugin Installation
    # ==========================================================================
    - name: Create directory for Docker apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add target user to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: yes

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ==========================================================================
    # 5. Tailscale Mesh VPN Installation
    # ==========================================================================
    - name: Download Tailscale official GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale official repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
        state: present
        filename: tailscale

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: yes

    - name: Ensure tailscaled daemon is enabled and running
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: yes

    # ==========================================================================
    # 6. Firewall (UFW) Hardening
    # ==========================================================================
    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH port through UFW
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP and HTTPS (ports 80 and 443)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Allow all traffic on Tailscale mesh interface (tailscale0)
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

    # ==========================================================================
    # 7. Deploy Homelab Repository
    # ==========================================================================
    - name: Clone or pull homelab repository
      ansible.builtin.git:
        repo: "{{ homelab_git_repo }}"
        dest: "{{ homelab_install_dir }}"
        version: main
        force: yes

    - name: Ensure homelab directory ownership
      ansible.builtin.file:
        path: "{{ homelab_install_dir }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        recurse: no

    # ==========================================================================
    # 8. Storage & Persistent Volumes Provisioning
    # ==========================================================================
    - name: Create persistent service data directories on SSD
      ansible.builtin.file:
        path: "{{ storage_data_dir }}/{{ item }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'
      loop:
        - "vaultwarden"
        - "pihole/etc-pihole"
        - "pihole/etc-dnsmasq.d"
        - "uptime-kuma"
        - "prometheus"
        - "grafana"
        - "portainer"

    - name: Create backups directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Adjust permissions for Prometheus and Grafana container volumes
      ansible.builtin.file:
        path: "{{ storage_data_dir }}/{{ item }}"
        mode: '0777'
      loop:
        - "prometheus"
        - "grafana"

    # ==========================================================================
    # 9. Configuration & SSL Bootstrap
    # ==========================================================================
    - name: Generate placeholder SSL certificate if needed
      ansible.builtin.command:
        cmd: "bash scripts/generate-self-signed-ssl.sh"
        chdir: "{{ homelab_install_dir }}"
        creates: "{{ homelab_install_dir }}/ssl/live/fullchain.pem"

    - name: Deploy .env configuration file
      ansible.builtin.template:
        src: "{{ homelab_install_dir }}/.env.example"
        dest: "{{ homelab_install_dir }}/.env"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
        force: no

    # ==========================================================================
    # 10. Scheduled Maintenance (Cron Jobs)
    # ==========================================================================
    - name: Set up daily volume backup cron job at 04:00
      ansible.builtin.cron:
        name: "Homelab daily volume backup"
        minute: "0"
        hour: "4"
        job: "bash {{ homelab_install_dir }}/scripts/backup-volumes.sh > /var/log/homelab-backup.log 2>&1"
        user: root

    - name: Set up Dead Man's Snitch uptime heartbeat ping
      ansible.builtin.cron:
        name: "Dead Mans Snitch ping"
        minute: "*/5"
        job: "curl -fsS --retry 3 {{ dead_mans_snitch_url }} >/dev/null 2>&1"
        user: root

    # ==========================================================================
    # 11. Start Docker Compose Stack
    # ==========================================================================
    - name: Start homelab Docker Compose stack
      ansible.builtin.command:
        cmd: "docker compose up -d"
        chdir: "{{ homelab_install_dir }}"

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
